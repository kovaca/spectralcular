- name: IKAW
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Kawashima Index. Formula: (R-B)/(R+B). Reference: https://doi.org/10.1006/anbo.1997.0544'
- name: IPVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
  expressive_in: []
  status: proposed
  notes: 'Infrared Percentage Vegetation Index. Formula: N/(N+R). Reference: https://doi.org/10.1016/0034-4257(90)90085-Z'
- name: IRECI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    RE3: rededge3
    R: red
    RE1: rededge1
    RE2: rededge2
  expressive_in: []
  status: proposed
  notes: 'Inverted Red-Edge Chlorophyll Index. Formula: (RE3-R)/(RE1/RE2). Reference: https://doi.org/10.1016/j.isprsjprs.2013.04.007'
- name: IRGBVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Improved-Red-Green-Blue Vegetation Index. Formula: (5.0*(G**2.0)-2.0*(R**2.0)-5.0*(B**2.0))/(5.0*(G**2.0)+2.0*(R**2.0)+5.0*(B**2.0)).
