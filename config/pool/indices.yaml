- name: MCARIOSAVI705
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    RE2: rededge2
    RE1: rededge1
    G: green
  expressive_in: []
  status: proposed
  notes: 'MCARI/OSAVI Ratio (705 and 750 nm). Formula: (((RE2-RE1)-0.2*(RE2-G))*(RE2/RE1))/(1.16*(RE2-RE1)/(RE2+RE1+0.16)).
