  status: proposed
  notes: 'Modified Non-Linear Vegetation Index. Formula: (1+L)*((N**2)-R)/((N**2)+R+L). Reference: https://doi.org/10.1109/TGRS.2003.812910'
- name: MRBVI
  theme: vegetation
