# Stage-3 indices pool — derived from spyndex.indices via
# `uv run python -m spectralcular.pool_gen` (see src/spectralcular/pool_gen.py).
# Each entry maps spyndex parameter names to STAC asset keys on `platform`
# (see src/spectralcular/platforms.py). spyndex auto-supplies constants
# (g/C1/C2/L/…); band-centre wavelengths (lambda*) come from the platform.
#
# Resolution floor surfaces implicitly through `bands`: on Sentinel-2 any
# SWIR (S1/S2), N2 (B8A) or red-edge parameter pulls the grid to 20 m and
# A (coastal) to 60 m; Landsat is 30 m; Sentinel-1 RTC is 10 m.
#
# Edit `status:` / `notes:` / `expressive_in:` in place to drive the editorial
# loop — regeneration preserves them.

entries:
- name: AFRI1600
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    S1: swir16
  expressive_in: []
  status: proposed
  notes: 'Aerosol Free Vegetation Index (1600 nm). Formula: (N-0.66*S1)/(N+0.66*S1). Reference: https://doi.org/10.1016/S0034-4257(01)00190-0'
- name: AFRI2100
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    S2: swir22
  expressive_in: []
  status: proposed
  notes: 'Aerosol Free Vegetation Index (2100 nm). Formula: (N-0.5*S2)/(N+0.5*S2). Reference: https://doi.org/10.1016/S0034-4257(01)00190-0'
- name: ARI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    RE1: rededge1
  expressive_in: []
  status: proposed
  notes: 'Anthocyanin Reflectance Index. Formula: (1/G)-(1/RE1). Reference: https://doi.org/10.1562/0031-8655(2001)074%3C0038:OPANEO%3E2.0.CO;2'
- name: ARI2
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
    RE1: rededge1
  expressive_in: []
  status: proposed
  notes: 'Anthocyanin Reflectance Index 2. Formula: N*((1/G)-(1/RE1)). Reference: https://doi.org/10.1562/0031-8655(2001)074%3C0038:OPANEO%3E2.0.CO;2'
- name: ARVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Atmospherically Resistant Vegetation Index. Formula: (N-(R-gamma*(R-B)))/(N+(R-gamma*(R-B))). Reference:
    https://doi.org/10.1109/36.134076'
- name: ATSAVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
  expressive_in: []
  status: proposed
  notes: 'Adjusted Transformed Soil-Adjusted Vegetation Index. Formula: sla*(N-sla*R-slb)/(sla*N+R-sla*slb+0.08*(1+sla**2.0)).
    Reference: https://doi.org/10.1016/0034-4257(91)90009-U'
- name: AVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
  expressive_in: []
  status: proposed
  notes: 'Advanced Vegetation Index. Formula: (N*(1.0-R)*(N-R))**(1/3). Reference: http://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.465.8749&rep=rep1&type=pdf'
- name: BCC
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    B: blue
    R: red
    G: green
  expressive_in: []
  status: proposed
  notes: 'Blue Chromatic Coordinate. Formula: B/(R+G+B). Reference: https://doi.org/10.1016/0034-4257(87)90088-5'
- name: BNDVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Blue Normalized Difference Vegetation Index. Formula: (N-B)/(N+B). Reference: https://doi.org/10.1016/S1672-6308(07)60027-4'
- name: BWDRVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Blue Wide Dynamic Range Vegetation Index. Formula: (alpha*N-B)/(alpha*N+B). Reference: https://doi.org/10.2135/cropsci2007.01.0031'
- name: CIG
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
  expressive_in: []
  status: proposed
  notes: 'Chlorophyll Index Green. Formula: (N/G)-1.0. Reference: https://doi.org/10.1078/0176-1617-00887'
- name: CIRE
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    RE1: rededge1
  expressive_in: []
  status: proposed
  notes: 'Chlorophyll Index Red Edge. Formula: (N/RE1)-1. Reference: https://doi.org/10.1078/0176-1617-00887'
- name: CRI550
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    B: blue
    G: green
  expressive_in: []
  status: proposed
  notes: 'Carotenoid Reflectance Index using 550 nm. Formula: (1.0/B)-(1.0/G). Reference: https://doi.org/10.1562/0031-8655(2002)0750272ACCIPL2.0.CO2'
- name: CRI700
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    B: blue
    RE1: rededge1
  expressive_in: []
  status: proposed
  notes: 'Carotenoid Reflectance Index using 700 nm. Formula: (1.0/B)-(1.0/RE1). Reference: https://doi.org/10.1562/0031-8655(2002)0750272ACCIPL2.0.CO2'
- name: CRSWIR
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    S1: swir16
    N2: nir08
    S2: swir22
  expressive_in: []
  status: proposed
  notes: 'Continuum Removal SWIR. Formula: S1/(N2+((S2-N2)/(lambdaS2-lambdaN2))*(lambdaS1-lambdaN2)). Reference:
    https://www.onf.fr/onf/+/cec::les-rendez-vous-techniques-de-lonf-no69-70.html'
- name: CVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
    G: green
  expressive_in: []
  status: proposed
  notes: 'Chlorophyll Vegetation Index. Formula: (N*R)/(G**2.0). Reference: https://doi.org/10.1007/s11119-010-9204-3'
- name: DSI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    S1: swir16
    N: nir
  expressive_in: []
  status: proposed
  notes: 'Drought Stress Index. Formula: S1/N. Reference: https://www.asprs.org/wp-content/uploads/pers/1999journal/apr/1999_apr_495-501.pdf'
- name: DSWI1
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    S1: swir16
  expressive_in: []
  status: proposed
  notes: 'Disease-Water Stress Index 1. Formula: N/S1. Reference: https://doi.org/10.1080/01431160310001618031'
- name: DSWI2
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    S1: swir16
    G: green
  expressive_in: []
  status: proposed
  notes: 'Disease-Water Stress Index 2. Formula: S1/G. Reference: https://doi.org/10.1080/01431160310001618031'
- name: DSWI3
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    S1: swir16
    R: red
  expressive_in: []
  status: proposed
  notes: 'Disease-Water Stress Index 3. Formula: S1/R. Reference: https://doi.org/10.1080/01431160310001618031'
- name: DSWI4
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    R: red
  expressive_in: []
  status: proposed
  notes: 'Disease-Water Stress Index 4. Formula: G/R. Reference: https://doi.org/10.1080/01431160310001618031'
- name: DSWI5
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
    S1: swir16
    R: red
  expressive_in: []
  status: proposed
  notes: 'Disease-Water Stress Index 5. Formula: (N+G)/(S1+R). Reference: https://doi.org/10.1080/01431160310001618031'
- name: DVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
  expressive_in: []
  status: proposed
  notes: 'Difference Vegetation Index. Formula: N-R. Reference: https://doi.org/10.1016/0034-4257(94)00114-3'
- name: DVIplus
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    N: nir
    R: red
  expressive_in: []
  status: proposed
  notes: 'Difference Vegetation Index Plus. Formula: ((lambdaN-lambdaR)/(lambdaN-lambdaG))*G+(1.0-((lambdaN-lambdaR)/(lambdaN-lambdaG)))*N-R.
    Reference: https://doi.org/10.1016/j.rse.2019.03.028'
- name: EBI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    R: red
    G: green
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Enhanced Bloom Index. Formula: (R+G+B)/((G/B)*(R-B+epsilon)). Reference: https://doi.org/10.1016/j.isprsjprs.2019.08.006'
- name: ENDVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Enhanced Normalized Difference Vegetation Index. Formula: ((N+G)-(2*B))/((N+G)+(2*B)). Reference: https://doi.org/10.1371/journal.pone.0186193'
- name: EVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
    B: blue
  expressive_in: []
  status: approved
  notes: 'Enhanced Vegetation Index. Formula: g*(N-R)/(N+C1*R-C2*B+L). Reference: https://doi.org/10.1016/S0034-4257(96)00112-5'
- name: EVI2
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
  expressive_in: []
  status: proposed
  notes: 'Two-Band Enhanced Vegetation Index. Formula: g*(N-R)/(N+2.4*R+L). Reference: https://doi.org/10.1016/j.rse.2008.06.006'
- name: EVIv
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Enhanced Vegetation Index of Vegetation. Formula: 2.5*((N-R)/(N+6*R-7.5*B+1.0))*N. Reference: https://doi.org/10.1029/2024JG008240'
- name: ExG
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Excess Green Index. Formula: 2*G-R-B. Reference: https://doi.org/10.13031/2013.27838'
- name: ExGR
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'ExG - ExR Vegetation Index. Formula: (2.0*G-R-B)-(1.3*R-G). Reference: https://doi.org/10.1016/j.compag.2008.03.009'
- name: ExR
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    R: red
    G: green
  expressive_in: []
  status: proposed
  notes: 'Excess Red Index. Formula: 1.3*R-G. Reference: https://doi.org/10.1117/12.336896'
- name: FCVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
    G: green
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Fluorescence Correction Vegetation Index. Formula: N-((R+G+B)/3.0). Reference: https://doi.org/10.1016/j.rse.2020.111676'
- name: GARI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
    B: blue
    R: red
  expressive_in: []
  status: proposed
  notes: 'Green Atmospherically Resistant Vegetation Index. Formula: (N-(G-(B-R)))/(N-(G+(B-R))). Reference: https://doi.org/10.1016/S0034-4257(96)00072-7'
- name: GBNDVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Green-Blue Normalized Difference Vegetation Index. Formula: (N-(G+B))/(N+(G+B)). Reference: https://doi.org/10.1016/S1672-6308(07)60027-4'
- name: GCC
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Green Chromatic Coordinate. Formula: G/(R+G+B). Reference: https://doi.org/10.1016/0034-4257(87)90088-5'
- name: GDVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
  expressive_in: []
  status: proposed
  notes: 'Generalized Difference Vegetation Index. Formula: ((N**nexp)-(R**nexp))/((N**nexp)+(R**nexp)). Reference:
    https://doi.org/10.3390/rs6021211'
- name: GEMI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
  expressive_in: []
  status: proposed
  notes: 'Global Environment Monitoring Index. Formula: ((2.0*((N**2.0)-(R**2.0))+1.5*N+0.5*R)/(N+R+0.5))*(1.0-0.25*((2.0*((N**2.0)-(R**2))+1.5*N+0.5*R)/(N+R+0.5)))-((R-0.125)/(1-R)).
    Reference: http://dx.doi.org/10.1007/bf00031911'
- name: GLI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'Green Leaf Index. Formula: (2.0*G-R-B)/(2.0*G+R+B). Reference: http://dx.doi.org/10.1080/10106040108542184'
- name: GM1
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    RE2: rededge2
    G: green
  expressive_in: []
  status: proposed
  notes: 'Gitelson and Merzlyak Index 1. Formula: RE2/G. Reference: https://doi.org/10.1016/S0176-1617(96)80284-7'
- name: GM2
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    RE2: rededge2
    RE1: rededge1
  expressive_in: []
  status: proposed
  notes: 'Gitelson and Merzlyak Index 2. Formula: RE2/RE1. Reference: https://doi.org/10.1016/S0176-1617(96)80284-7'
- name: GNDVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
  expressive_in: []
  status: proposed
  notes: 'Green Normalized Difference Vegetation Index. Formula: (N-G)/(N+G). Reference: https://doi.org/10.1016/S0034-4257(96)00072-7'
- name: GOSAVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
  expressive_in: []
  status: proposed
  notes: 'Green Optimized Soil Adjusted Vegetation Index. Formula: (N-G)/(N+G+0.16). Reference: https://doi.org/10.2134/agronj2004.0314'
- name: GRNDVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
    R: red
  expressive_in: []
  status: proposed
  notes: 'Green-Red Normalized Difference Vegetation Index. Formula: (N-(G+R))/(N+(G+R)). Reference: https://doi.org/10.1016/S1672-6308(07)60027-4'
- name: GRVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
  expressive_in: []
  status: proposed
  notes: 'Green Ratio Vegetation Index. Formula: N/G. Reference: https://doi.org/10.2134/agronj2004.0314'
- name: GSAVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    G: green
  expressive_in: []
  status: proposed
  notes: 'Green Soil Adjusted Vegetation Index. Formula: (1.0+L)*(N-G)/(N+G+L). Reference: https://doi.org/10.2134/agronj2004.0314'
- name: GVMI
