- name: MGRVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    G: green
    R: red
  expressive_in: []
  status: proposed
  notes: 'Modified Green Red Vegetation Index. Formula: (G**2.0-R**2.0)/(G**2.0+R**2.0). Reference: https://doi.org/10.1016/j.jag.2015.02.012'
- name: MI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    S1: swir16
  expressive_in: []
  status: proposed
  notes: 'Mangrove Index. Formula: (N-S1)/(N*S1). Reference: https://www.researchgate.net/profile/Gathot-Winarso/publication/277137915_NEW_MANGROVE_INDEX_AS_DEGRADATIONHEALTH_INDICATOR_USING_REMOTE_SENSING_DATA_SEGARA_ANAKAN_AND_ALAS_PURWO_CASE_STUDY/links/5562d90c08ae8c0cab333ab4/NEW-MANGROVE-INDEX-AS-DEGRADATION-HEALTH-INDICATOR-USING-REMOTE-SENSING-DATA-SEGARA-ANAKAN-AND-ALAS-PURWO-CASE-STUDY.pdf'
- name: MNDVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    S2: swir22
  expressive_in: []
  status: proposed
  notes: 'Modified Normalized Difference Vegetation Index. Formula: (N-S2)/(N+S2). Reference: https://doi.org/10.1080/014311697216810'
