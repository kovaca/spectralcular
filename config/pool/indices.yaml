- name: IAVI
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
    B: blue
  expressive_in: []
  status: proposed
  notes: 'New Atmospherically Resistant Vegetation Index. Formula: (N-(R-gamma*(B-R)))/(N+(R-gamma*(B-R))). Reference:
