    R: red
    G: green
  expressive_in: []
  status: proposed
  notes: 'Modified Chlorophyll Absorption in Reflectance Index. Formula: ((RE1-R)-0.2*(RE1-G))*(RE1/R). Reference:
    http://dx.doi.org/10.1016/S0034-4257(00)00113-9'
- name: MCARI1
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
    G: green
  expressive_in: []
  status: proposed
  notes: 'Modified Chlorophyll Absorption in Reflectance Index 1. Formula: 1.2*(2.5*(N-R)-1.3*(N-G)). Reference:
    https://doi.org/10.1016/j.rse.2003.12.013'
- name: MCARI2
  theme: vegetation
  platform: sentinel-2-l2a
  bands:
    N: nir
    R: red
    G: green
  expressive_in: []
  status: proposed
  notes: 'Modified Chlorophyll Absorption in Reflectance Index 2. Formula: (1.5*(2.5*(N-R)-1.3*(N-G)))/((((2.0*N+1)**2)-(6.0*N-5*(R**0.5))-0.5)**0.5).
