name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (pytest + web-data freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install system libraries (WeasyPrint, rasterio)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --frozen
      - run: uv run ruff check src tests tools
      - run: uv run pytest -q
      - name: Committed web data matches the pools
        # web/src/lib/data is generated by `spectralcular export-web` but committed so the
        # web app builds without Python. Fail if someone edited a pool and forgot.
        # PNGs are compared by decoded pixels: zlib builds differ across platforms
        # (Pillow's macOS wheels use zlib-ng), so identical images can differ in bytes.
        run: |
          uv run spectralcular export-web --out /tmp/webdata
          uv run python - <<'EOF'
          import sys
          from pathlib import Path
          from PIL import Image

          def pixels(p):
              with Image.open(p) as im:
                  return im.mode, im.size, im.tobytes()

          stale = []
          for new in sorted(Path("/tmp/webdata").iterdir()):
              old = Path("web/src/lib/data") / new.name
              if not old.exists():
                  same = False
              elif new.suffix == ".png":
                  same = pixels(new) == pixels(old)
              else:
                  same = new.read_bytes() == old.read_bytes()
              if not same:
                  stale.append(new.name)
                  print(f"stale: web/src/lib/data/{new.name}")
          sys.exit(1 if stale else 0)
          EOF

  web:
    name: Web (vitest + svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version from web/package.json "packageManager"
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
