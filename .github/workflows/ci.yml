name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (pytest + web-data freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install system libraries (WeasyPrint, rasterio)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --frozen
      - run: uv run ruff check src tests tools
      - run: uv run pytest -q
      - name: Committed web data matches the pools
        # web/src/lib/data is generated by `spectralcular export-web` but committed so the
        # web app builds without Python. Fail if someone edited a pool and forgot.
        run: |
          uv run spectralcular export-web --out /tmp/webdata
          status=0
          for f in /tmp/webdata/*; do
            cmp -s "$f" "web/src/lib/data/$(basename "$f")" || { echo "stale: web/src/lib/data/$(basename "$f")"; status=1; }
          done
          exit $status

  web:
    name: Web (vitest + svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version from web/package.json "packageManager"
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
