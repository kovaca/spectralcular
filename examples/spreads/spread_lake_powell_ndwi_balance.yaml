asset_id: lake_powell_ndwi_balance

location:
  name: Lake Powell
  # Glen Canyon / Padre Bay area — drowned tributaries snaking through
  # red sandstone. Bbox ≈ 26.7 × 33.4 km at lat 37°N, just inside the
  # 26.25 × 33.75 km AOI ceiling for US Letter portrait at 300 DPI.
  bbox: [-111.05, 36.90, -110.75, 37.20]   # lon_min, lat_min, lon_max, lat_max

imagery:
  source: sentinel-2-l2a
  date_range: 2023-07-01/2023-08-31
  cloud_cover_max: 10

index:
  name: NDWI
  bands:
    G: green   # Sentinel-2 B03
    N: nir     # Sentinel-2 B08

colormap:
  name: cmocean:balance
  normalization:
    # Diverging method picks ±max|x| symmetric around 0 — honors the
    # natural water/land pivot at NDWI = 0.
    method: diverging

layout:
  template: full_image_plus_diagnostics
  page_size: Letter
  orientation: portrait
  dpi: 300
  annotations: minimal
  outputs: [pdf, html]
  caption: "Lake Powell — NDWI, July–August 2023"
  plate_number: "002"
  interpretive_note: >
    Glen Canyon's drowned tributaries register against desiccated red-rock
    shoreline; NDWI splits open water from exposed bedrock at zero. Balance
    colormap centered on the index's natural water/land pivot — diverging
    palette for a diverging index.
