# Blank lines separate paragraphs.
introduction: |
  Each scene in this book pairs three things: a place on Earth, a spectral
  index computed from satellite data of that place, and a colormap that turns
  the index into a gloriously chromatic display. The place supplies the
  subject, the index encodes a measurement tuned to a given property —
  vegetation vigor, surface water, burn scars, bare mineral soil — and the
  colormap gets applied in an effort to display that well.

  The left-hand page of every spread is the scene itself, printed to the edge
  of the paper. The right-hand page is its specimen card: the formula and the
  bands that went into it, the scene and its date, a true color sample of the
  same scene, where on Earth it is, and the colormap laid out on its own with
  its lightness, chroma and hue, above a histogram of the values the scene
  renders. I love histograms, and hope you will too.

  The imagery is Copernicus Sentinel-2 surface reflectance at 10 to 20 meters
  per pixel, chosen scene by scene for clear skies. A scene frames up to about
  26 by 34 kilometers at full resolution — one satellite pixel per printed
  dot — and wider frames trade detail for reach. Index formulas come from the
  Awesome Spectral Indices catalog; the colormaps come from the scientific and
  cartographic collections credited on the copyright page.

