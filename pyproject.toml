[project]
name = "spectralcular"
version = "0.3.0"
description = "Spectralcular Scenery: a print-ready book of satellite spectral indices × colormaps — a static web picker, a versioned selection manifest, and a reproducible render pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "Alex Kovac" }]
keywords = ["remote-sensing", "sentinel-2", "colormaps", "cartography", "print", "book", "spectral-indices"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pystac-client>=0.8",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "numpy>=1.26",
    "shapely>=2.0",
    "spyndex>=0.6",
    "palettize>=0.0.1a3",
    "matplotlib>=3.8",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "weasyprint>=68.1",
    "jinja2>=3.1.6",
    "odc-stac>=0.3",
    "planetary-computer>=1.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/kovaca/spectralcular"
Repository = "https://github.com/kovaca/spectralcular"
Issues = "https://github.com/kovaca/spectralcular/issues"
"Colormap catalog" = "https://colorcurio.us/colormaps"

[project.scripts]
spectralcular = "spectralcular.cli:main"
gb = "spectralcular.cli:main"  # short alias

[dependency-groups]
dev = [ "pytest>=8.0", "ruff>=0.6" ]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "spectralcular"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness only (pyflakes + syntax errors); style is left to review.
select = ["F", "E9"]

